<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Dashboard</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h1 class="card-title">Telegram Bot Dashboard</h1>
                        <p class="card-text">Monitor which groups, channels, and users your bot is interacting with.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h4>Statistics</h4>
                    </div>
                    <div class="card-body">
                        <div class="row" id="stats-container">
                            <div class="col-md-2 mb-3">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <h5>Total</h5>
                                        <h3 id="total-chats">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 mb-3">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h5>Groups</h5>
                                        <h3 id="groups-count">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 mb-3">
                                <div class="card bg-info text-white">
                                    <div class="card-body text-center">
                                        <h5>Supergroups</h5>
                                        <h3 id="supergroups-count">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 mb-3">
                                <div class="card bg-warning text-white">
                                    <div class="card-body text-center">
                                        <h5>Channels</h5>
                                        <h3 id="channels-count">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 mb-3">
                                <div class="card bg-secondary text-white">
                                    <div class="card-body text-center">
                                        <h5>Private</h5>
                                        <h3 id="private-count">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 mb-3">
                                <div class="card" id="refresh-card">
                                    <button class="btn btn-outline-primary h-100" onclick="loadData()">
                                        <i class="fas fa-sync-alt"></i> Refresh
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4>Bot Chat List</h4>
                        <div class="input-group" style="max-width: 300px;">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control" id="search-input" placeholder="Search chats...">
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name/Title</th>
                                        <th>Type</th>
                                        <th>Members</th>
                                        <th>Added Date</th>
                                        <th>Last Activity</th>
                                    </tr>
                                </thead>
                                <tbody id="chats-table-body">
                                    <tr>
                                        <td colspan="6" class="text-center">Loading data...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Function to load chats data
        function loadData() {
            // Load statistics
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-chats').textContent = data.total;
                    document.getElementById('groups-count').textContent = data.groups;
                    document.getElementById('supergroups-count').textContent = data.supergroups;
                    document.getElementById('channels-count').textContent = data.channels;
                    document.getElementById('private-count').textContent = data.private;
                })
                .catch(error => console.error('Error loading stats:', error));

            // Load chats
            fetch('/api/chats')
                .then(response => response.json())
                .then(chats => {
                    const tableBody = document.getElementById('chats-table-body');
                    
                    if (chats.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" class="text-center">No chats found. Add the bot to groups or channels to see them here.</td></tr>';
                        return;
                    }
                    
                    tableBody.innerHTML = '';
                    
                    chats.forEach(chat => {
                        const row = document.createElement('tr');
                        
                        // Format the name/title based on chat type
                        let name;
                        if (chat.type === 'private') {
                            const firstName = chat.first_name || '';
                            const lastName = chat.last_name || '';
                            name = `${firstName} ${lastName}`.trim();
                            if (chat.username) {
                                name += ` (@${chat.username})`;
                            }
                        } else {
                            name = chat.title || 'Unnamed';
                            if (chat.username) {
                                name += ` (@${chat.username})`;
                            }
                        }
                        
                        // Create type badge with appropriate color
                        let typeClass;
                        switch (chat.type) {
                            case 'private':
                                typeClass = 'bg-secondary';
                                break;
                            case 'group':
                                typeClass = 'bg-success';
                                break;
                            case 'supergroup':
                                typeClass = 'bg-info';
                                break;
                            case 'channel':
                                typeClass = 'bg-warning';
                                break;
                            default:
                                typeClass = 'bg-primary';
                        }
                        
                        row.innerHTML = `
                            <td><code>${chat.id}</code></td>
                            <td>${name}</td>
                            <td><span class="badge ${typeClass}">${chat.type}</span></td>
                            <td>${chat.members_count || '-'}</td>
                            <td>${chat.added_date || '-'}</td>
                            <td>${chat.last_activity || '-'}</td>
                        `;
                        
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error loading chats:', error);
                    document.getElementById('chats-table-body').innerHTML = 
                        '<tr><td colspan="6" class="text-center text-danger">Error loading data. Please try again.</td></tr>';
                });
        }

        // Search functionality
        document.getElementById('search-input').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const rows = document.querySelectorAll('#chats-table-body tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadData);
    </script>

    <!-- Add Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
